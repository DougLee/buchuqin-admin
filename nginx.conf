# buchuqin-admin 容器运行时 nginx 配置（随 Dockerfile COPY 进镜像）
# 职责：静态直出 dist + /api/v1 同源反代 nest 服务（前端 api.ts 用相对路径，
# 同源无 CORS）+ SPA 路由回退。
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # API 反代：compose 内 nest 服务名即主机名
  location /api/v1/ {
    proxy_pass http://nest:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA history 路由：刷新子路径回退 index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 带内容哈希的静态资源长缓存
  location ~* \.(js|css|png|jpg|jpeg|webp|svg|ico|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public";
  }
}
